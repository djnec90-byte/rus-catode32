name: Build ESP32-C3 Firmware Components

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - name: Install espflash
        run: cargo install espflash --no-default-features --features cli

      - name: Build Firmware for ESP32-C3
        run: cargo build --release -p catode32-firmware --no-default-features --features c3 --target riscv32imc-unknown-none-elf

      # espflash save-image БЕЗ флага --merge автоматически создаст ТРИ раздельных файла:
      # 1. Загрузчик (firmware.bootloader.bin)
      # 2. Правильную таблицу разделов (firmware.partition-table.bin) c 24 КБ NVS под сохранения
      # 3. Само приложение игры (firmware.bin)
      - name: Convert ELF to Separated Images
        run: |
          espflash save-image --chip esp32c3 --flash-size 4mb --flash-mode dio target/riscv32imc-unknown-none-elf/release/catode32-firmware firmware.bin

      # Переименуем их для удобства перед отправкой в артефакты
      - name: Prepare Files
        run: |
          mv firmware.bootloader.bin bootloader.bin
          mv firmware.partition-table.bin partitions.bin
          mv firmware.bin app.bin

      - name: Upload All Components
        uses: actions/upload-artifact@v4
        with:
          name: catode32-separated-bins
          path: |
            app.bin
            bootloader.bin
            partitions.bin
