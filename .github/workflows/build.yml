name: Build ESP32-C3 Firmware Components

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - name: Install espflash
        run: cargo install espflash --no-default-features --features cli

      - name: Build Firmware for ESP32-C3
        run: cargo build --release -p catode32-firmware --no-default-features --features c3 --target riscv32imc-unknown-none-elf

      # Генерируем раздельные файлы. Флаг --flash-mode dio жестко зашивается внутрь загрузчика.
      - name: Convert ELF to Separated Images
        run: |
          espflash save-image --chip esp32c3 --flash-size 4mb --flash-mode dio target/riscv32imc-unknown-none-elf/release/catode32-firmware output.bin

      # Просто забираем ВСЕ бинарники, которые создала утилита espflash в корневой папке
      - name: Upload All Components
        uses: actions/upload-artifact@v4
        with:
          name: catode32-separated-bins
          path: "./*.bin"
