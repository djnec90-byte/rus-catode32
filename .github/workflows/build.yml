name: Build ESP32-C3 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      # Ставим утилиту espflash для правильной сборки Rust-прошивок
      - name: Install espflash tool
        run: cargo install espflash --no-default-features --features cli

      - name: Build Firmware for ESP32-C3
        run: cargo build --release -p catode32-firmware --no-default-features --features c3 --target riscv32imc-unknown-none-elf

      # Генерируем ОДИН готовый образ, включающий в себя загрузчик, 
      # правильную таблицу разделов и саму игру для записи с адреса 0x0
      - name: Convert ELF to Monolithic Flash BIN
        run: |
          espflash save-image --chip esp32c3 --flash-size 4mb target/riscv32imc-unknown-none-elf/release/catode32-firmware firmware.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catode32-esp32c3-firmware
          path: firmware.bin
