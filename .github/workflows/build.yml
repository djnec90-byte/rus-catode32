name: Build ESP32-C3 Monolithic Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - name: Install espflash
        run: cargo install espflash --no-default-features --features cli

      - name: Build Firmware for ESP32-C3
        run: cargo build --release -p catode32-firmware --no-default-features --features c3 --target riscv32imc-unknown-none-elf

      # Генерируем ОДИН монолитный файл, но ПРИНУДИТЕЛЬНО внедряем туда 
      # режим DIO и твой конфигурационный файл partitions.csv с 24 КБ NVS.
      # Если partitions.csv лежит в корне, путь оставляем как есть. Если в crates/firmware/, укажи правильный путь.
      - name: Convert ELF to Monolithic DIO BIN
        run: |
          espflash save-image --chip esp32c3 --flash-size 4mb --flash-mode dio --partition-table partitions.csv target/riscv32imc-unknown-none-elf/release/catode32-firmware firmware.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catode32-esp32c3-firmware
          path: firmware.bin
