name: Build ESP32-C3 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - name: Build Firmware for ESP32-C3
        run: cargo build --release -p catode32-firmware --no-default-features --features c3 --target riscv32imc-unknown-none-elf

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catode32-esp32c3-firmware
          path: target/riscv32imc-unknown-none-elf/release/catode32-firmware
