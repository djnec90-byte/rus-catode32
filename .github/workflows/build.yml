name: Build ESP32-C3 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      # Ставим официальную системную утилиту от Espressif через питон
      - name: Install esptool
        run: pip install esptool

      - name: Build Firmware for ESP32-C3
        run: cargo build --release -p catode32-firmware --no-default-features --features c3 --target riscv32imc-unknown-none-elf

      # Сами очищаем файл от отладочной информации и превращаем его в правильный легкий .bin
      - name: Install cargo-espflash
        run: cargo install cargo-espflash --version 3.1.2

      - name: Build and Merge Firmware to single BIN
        run: |
          cargo espflash save-image \
            --release \
            --chip esp32c3 \
            -p catode32-firmware \
            --no-default-features \
            --features c3 \
            --target riscv32imc-unknown-none-elf \
            --flash-size 4mb \
            firmware.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catode32-esp32c3-firmware
          path: firmware.bin
