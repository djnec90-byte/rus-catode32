[package]
name = "catode32"
version = "0.10.0"
edition = "2021"
description = "ESP32 virtual pet — Rust rewrite of the MicroPython v0.9.x line"
license = "MIT"
repository = "https://github.com/moonbench/catode32"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32c6", "rt"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-storage = { version = "0.9.0", features = ["esp32c6"] }
embedded-storage = "0.3"
ssd1306 = "0.10.0"
embedded-graphics = "0.8.2"
heapless = { version = "0.8", features = ["serde"] }
micromath = "2"
esp-hal-smartled2 = { version = "0.28.2", features = ["esp32c6"] }
smart-leds = "0.4.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
esp-alloc = "0.10.0"
esp-radio = { version = "0.18.0", default-features = false, features = ["esp32c6", "wifi", "esp-now", "esp-alloc", "unstable"] }
esp-rtos = { version = "0.3.0", default-features = false, features = ["esp32c6", "esp-radio", "esp-alloc"] }
embassy-futures = "0.1"

[profile.dev.package.esp-radio]
opt-level = 3
[profile.dev.package.esp-wifi-sys]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
