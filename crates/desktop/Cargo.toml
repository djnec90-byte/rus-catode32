[package]
name = "catode32-desktop"
version = "0.10.0"
edition = "2021"
description = "Desktop simulator for catode32"
license = "MIT"
repository = "https://github.com/moonbench/catode32"

[dependencies]
catode32-core = { path = "../core", default-features = false, features = ["desktop"] }
embedded-graphics = "0.8.2"
embedded-graphics-simulator = "0.7.0"

[[bin]]
name = "catode32-desktop"
path = "src/main.rs"
